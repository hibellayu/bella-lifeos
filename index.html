<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bella's LifeOS｜2026 年 05 月 04 日</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "PingFang TC", "Noto Sans TC", sans-serif;
      background: #0f0f14;
      color: #e8e0f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }
    .card {
      background: #1a1a2e;
      border: 1px solid #2e2e4a;
      border-radius: 20px;
      padding: 2.5rem 2rem;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 8px 40px rgba(0,0,0,0.4);
    }
    .header { margin-bottom: 2rem; text-align: center; }
    .header .name {
      font-size: 0.85rem;
      color: #a78bfa;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 0.4rem;
    }
    .header .date {
      font-size: 1.6rem;
      font-weight: 700;
      color: #f3eeff;
    }
    .header .weekday {
      font-size: 0.9rem;
      color: #6b6b8a;
      margin-top: 0.2rem;
    }
    .section h2 {
      font-size: 1rem;
      color: #a78bfa;
      margin-bottom: 1.2rem;
      letter-spacing: 0.05em;
    }
    .events { list-style: none; }
    .events li {
      display: flex;
      gap: 1rem;
      align-items: flex-start;
      padding: 0.75rem 0;
      border-bottom: 1px solid #2a2a3e;
    }
    .events li:last-child { border-bottom: none; }
    .time {
      font-size: 0.8rem;
      color: #a78bfa;
      min-width: 42px;
      padding-top: 2px;
      font-variant-numeric: tabular-nums;
    }
    .title { font-size: 1rem; line-height: 1.5; color: #e8e0f0; }
    .quote-section blockquote {
      font-size: 1rem;
      line-height: 1.9;
      color: #d0c8e8;
      border-left: 3px solid #a78bfa;
      padding-left: 1.2rem;
    }
    .footer {
      margin-top: 2rem;
      text-align: center;
      font-size: 0.75rem;
      color: #3a3a5a;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="name">Bella's LifeOS</div>
      <div class="date">2026 年 05 月 04 日</div>
      <div class="weekday">星期一</div>
    </div>
    
        <div class="section">
          <h2>📅 今日行程</h2>
          <ul class="events"><li><span class="time">全天</span><span class="title">陽明山健走</span></li><li><span class="time">全天</span><span class="title">天赦日</span></li></ul>
        </div>
    <div class="footer">每日 09:00 台北時間自動更新</div>
  </div>
</body>
</html>
