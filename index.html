<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bella's LifeOS｜2026 年 05 月 24 日</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=Noto+Sans+TC:wght@300;400&family=Noto+Serif+TC:wght@300;400;600&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Noto Serif TC", "Songti TC", "Georgia", serif;
      background: #E8E0D5;
      color: #2C2318;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }
    .page {
      background: #F7F2EA;
      max-width: 460px;
      width: 100%;
      box-shadow: 0 2px 4px rgba(44,35,24,0.08), 0 12px 40px rgba(44,35,24,0.15);
    }
    .rings {
      display: flex;
      justify-content: center;
      gap: 2.8rem;
      padding: 0.7rem 0;
      background: #D4C8BC;
      border-bottom: 1px solid #BFB0A0;
    }
    .ring {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #F7F2EA;
      border: 2px solid #A89278;
      box-shadow: inset 0 1px 3px rgba(44,35,24,0.25);
    }
    .cal-header {
      padding: 2rem 2.5rem 1.5rem;
      text-align: center;
    }
    .month-label {
      font-size: 0.62rem;
      letter-spacing: 0.45em;
      color: #8B3A2A;
      font-family: -apple-system, "PingFang TC", sans-serif;
      font-weight: 500;
      margin-bottom: 0.4rem;
    }
    .day-number {
      font-size: 5.5rem;
      font-weight: 300;
      color: #2C2318;
      line-height: 0.9;
      letter-spacing: -0.04em;
      margin-bottom: 0.45rem;
    }
    .weekday-label {
      font-size: 0.68rem;
      color: #8A7B68;
      letter-spacing: 0.25em;
      font-family: -apple-system, "PingFang TC", sans-serif;
      margin-bottom: 0.7rem;
    }
    .lunar-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }
    .lunar-date {
      font-size: 0.62rem;
      color: #8A7B68;
      letter-spacing: 0.08em;
      font-family: -apple-system, "PingFang TC", sans-serif;
    }
    .solar-badge {
      display: inline-block;
      font-size: 0.58rem;
      color: #F7F2EA;
      background: #8B3A2A;
      padding: 0.1rem 0.5rem;
      letter-spacing: 0.12em;
      font-family: -apple-system, "PingFang TC", sans-serif;
    }
    .wave-sep {
      display: block;
      width: 100%;
      height: 10px;
    }
    .body {
      padding: 1.6rem 2.5rem 2rem;
    }
    .section-label {
      font-size: 0.58rem;
      letter-spacing: 0.35em;
      color: #8B3A2A;
      font-family: -apple-system, "PingFang TC", sans-serif;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.7rem;
    }
    .section-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #C4B5A0;
    }
    .events { list-style: none; }
    .events li {
      display: flex;
      gap: 0.9rem;
      align-items: baseline;
      padding: 0.5rem 0;
    }
    .time {
      font-size: 0.68rem;
      color: #8B3A2A;
      min-width: 36px;
      font-variant-numeric: tabular-nums;
      font-family: -apple-system, "PingFang TC", sans-serif;
      flex-shrink: 0;
    }
    .event-title {
      font-size: 0.88rem;
      line-height: 1.6;
      color: #2C2318;
      font-weight: 300;
    }
    .free-text {
      font-size: 0.85rem;
      color: #A89278;
      font-style: italic;
      padding: 0.3rem 0;
      font-weight: 300;
    }
    .section-gap {
      margin-top: 1.6rem;
    }
    .quote-area { text-align: center; }
    .quote-text {
      font-family: "Lora", "Noto Serif TC", serif;
      font-size: 0.88rem;
      line-height: 2;
      color: #2C2318;
      font-weight: 400;
      letter-spacing: 0.02em;
    }
    .quote-source {
      font-size: 0.6rem;
      color: #A89278;
      margin-top: 0.85rem;
      letter-spacing: 0.06em;
      font-family: -apple-system, "PingFang TC", sans-serif;
    }
    .quote-zh {
      font-size: 0.83rem;
      line-height: 1.9;
      color: #5A4A38;
      margin-top: 0.6rem;
      font-weight: 300;
    }
    .explore-wrap {
      margin-top: 1.3rem;
      padding: 0.85rem 1.1rem;
      background: #EDE8DC;
      border-left: 2px solid #8B3A2A;
      text-align: left;
    }
    .explore-label {
      font-size: 0.55rem;
      letter-spacing: 0.3em;
      color: #8B3A2A;
      font-family: -apple-system, "PingFang TC", sans-serif;
      margin-bottom: 0.5rem;
    }
    .explore-text {
      font-family: "Noto Sans TC", "PingFang TC", sans-serif;
      font-size: 0.78rem;
      color: #3A2510;
      line-height: 1.9;
      font-weight: 300;
    }
    .footer {
      padding: 0.85rem 2.5rem;
      border-top: 1px solid #BFB0A0;
      text-align: center;
      font-size: 0.55rem;
      color: #A89278;
      letter-spacing: 0.15em;
      font-family: -apple-system, "PingFang TC", sans-serif;
      background: #EFE8DF;
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="rings">
      <div class="ring"></div>
      <div class="ring"></div>
      <div class="ring"></div>
      <div class="ring"></div>
      <div class="ring"></div>
    </div>
    <div class="cal-header">
      <div class="month-label">MAY · 2026</div>
      <div class="day-number">24</div>
      <div class="weekday-label">星期日</div>
      <div class="lunar-row"><span class="lunar-date">農曆 四月初八</span></div>
    </div>
    <svg class="wave-sep" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 10" preserveAspectRatio="none">
      <path d="M0,5 C23,2 46,8 69,5 C92,2 115,8 138,5 C161,2 184,8 207,5 C230,2 253,8 276,5 C299,2 322,8 345,5 C368,2 391,8 414,5 C437,2 460,8 460,5" stroke="#C4B5A0" stroke-width="1.5" fill="none"/>
    </svg>
    <div class="body">
      <div class="section-label">今日行程</div>
      <p class="free-text">今日行程空白，好好留白。</p>
      <div class="quote-area section-gap">
        <div class="section-label">今日金句</div>
        <p class="quote-text">照見五蘊皆空，度一切苦厄。</p>
        
        <p class="quote-source">── 《般若波羅蜜多心經》</p>
        <div class="explore-wrap"><div class="explore-label">今日一問</div><p class="explore-text">當你觀察自己的身心時，是否曾感受到那些看似堅固的執著，其實都在不斷變化呢？</p></div>
      </div>
    </div>
    <div class="footer">BELLA'S LIFEOS · 每小時自動更新</div>
  </div>
</body>
</html>
