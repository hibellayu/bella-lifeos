<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bella's LifeOS｜2026 年 05 月 04 日</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "PingFang TC", "Noto Sans TC", sans-serif;
      background: #f0ede8;
      color: #3d3530;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }
    .card {
      background: #fdfaf7;
      border: 1px solid #e8ddd5;
      border-radius: 24px;
      padding: 2.5rem 2rem;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 4px 24px rgba(180,150,140,0.12);
    }
    .header {
      background: rgba(220, 180, 180, 0.8);
      border-radius: 20px 20px 0 0;
      margin: -2.5rem -2rem 2rem -2rem;
      padding: 2rem 2rem;
      text-align: center;
    }
    .header .name {
      font-size: 0.78rem;
      color: #8a6060;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-bottom: 0.5rem;
    }
    .header .date {
      font-size: 1.6rem;
      font-weight: 700;
      color: #3d2e2e;
    }
    .header .weekday {
      font-size: 0.9rem;
      color: #9a7070;
      margin-top: 0.25rem;
    }
    .divider {
      border: none;
      border-top: 1px solid #edd5d0;
      margin: 1.5rem 0;
    }
    .section { margin-bottom: 1.5rem; }
    .section:last-of-type { margin-bottom: 0; }
    .section h2 {
      font-size: 0.85rem;
      color: #9dbaa0;
      letter-spacing: 0.08em;
      margin-bottom: 1rem;
      text-transform: uppercase;
    }
    .events { list-style: none; }
    .events li {
      display: flex;
      gap: 1rem;
      align-items: flex-start;
      padding: 0.7rem 0;
      border-bottom: 1px solid #f0e5e0;
    }
    .events li:last-child { border-bottom: none; }
    .time {
      font-size: 0.78rem;
      color: #c4938a;
      min-width: 42px;
      padding-top: 2px;
      font-variant-numeric: tabular-nums;
    }
    .title { font-size: 0.95rem; line-height: 1.6; color: #3d3530; }
    .free-text {
      font-size: 1.05rem;
      color: #c4938a;
      font-weight: 500;
      padding: 0.5rem 0;
    }
    .quote-section blockquote {
      border-left: 3px solid #d4a8b0;
      padding-left: 1.2rem;
    }
    .quote-text {
      font-size: 0.95rem;
      line-height: 1.8;
      color: #3d3530;
      font-style: italic;
    }
    .quote-zh {
      font-size: 0.88rem;
      line-height: 1.7;
      color: #6b5a55;
      margin-top: 0.5rem;
    }
    .quote-source {
      font-size: 0.75rem;
      color: #b09a95;
      margin-top: 0.6rem;
      letter-spacing: 0.03em;
    }
    .quote-reflection {
      font-size: 0.85rem;
      color: #8a7570;
      margin-top: 0.8rem;
      line-height: 1.6;
    }
    .footer {
      margin-top: 2rem;
      text-align: center;
      font-size: 0.72rem;
      color: #c8bab5;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="name">Bella's LifeOS</div>
      <div class="date">2026 年 05 月 04 日</div>
      <div class="weekday">星期一</div>
    </div>
    <hr class="divider">
    
        <div class="section">
          <h2>📅 今日行程</h2>
          <ul class="events"><li><span class="time">全天</span><span class="title">天赦日</span></li></ul>
        </div>
    <hr class="divider">
    
        <div class="section quote-section">
          <h2>✨ 今日金句</h2>
          <blockquote>
            <p class="quote-text">The most precious gift we can offer anyone is our attention.</p>
            <p class="quote-zh">我們能給予他人最珍貴的禮物，是我們的專注與臨在。</p>
            <p class="quote-source">── 一行禪師《與自己和好》Being Peace</p>
            <p class="quote-reflection">🍺 真心聆聽別人時，對方能感受到被看見、被珍視，這比任何禮物都更溫暖。</p>
          </blockquote>
        </div>
    <div class="footer">每小時自動更新</div>
  </div>
</body>
</html>
