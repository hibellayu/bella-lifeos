<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bella's LifeOS｜2026 年 05 月 04 日</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "PingFang TC", "Noto Sans TC", sans-serif;
      background: #f0ede8;
      color: #3d3530;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }
    .card {
      background: #fdfaf7;
      border: 1px solid #e8ddd5;
      border-radius: 24px;
      padding: 2.5rem 2rem;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 4px 24px rgba(180,150,140,0.12);
    }
    .header {
      margin-bottom: 2rem;
      text-align: center;
    }
    .header-block {
      background: rgba(220, 180, 180, 0.8);
      border-radius: 16px;
      padding: 1.4rem 2rem;
      display: inline-block;
      min-width: 260px;
    }
    .header .name {
      font-size: 0.78rem;
      color: #8a6060;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-bottom: 0.5rem;
    }
    .header .date {
      font-size: 1.6rem;
      font-weight: 700;
      color: #3d2e2e;
    }
    .header .weekday {
      font-size: 0.9rem;
      color: #9a7070;
      margin-top: 0.25rem;
    }
    .divider {
      border: none;
      border-top: 1px solid #edd5d0;
      margin: 1.5rem 0;
    }
    .section { margin-bottom: 1.5rem; }
    .section:last-of-type { margin-bottom: 0; }
    .section h2 {
      font-size: 0.85rem;
      color: #9dbaA0;
      letter-spacing: 0.08em;
      margin-bottom: 1rem;
      text-transform: uppercase;
    }
    .events { list-style: none; }
    .events li {
      display: flex;
      gap: 1rem;
      align-items: flex-start;
      padding: 0.7rem 0;
      border-bottom: 1px solid #f0e5e0;
    }
    .events li:last-child { border-bottom: none; }
    .time {
      font-size: 0.78rem;
      color: #c4938a;
      min-width: 42px;
      padding-top: 2px;
      font-variant-numeric: tabular-nums;
    }
    .title { font-size: 0.95rem; line-height: 1.6; color: #3d3530; }
    .free-text {
      font-size: 1.05rem;
      color: #c4938a;
      font-weight: 500;
      padding: 0.5rem 0;
    }
    .quote-section blockquote {
      font-size: 0.93rem;
      line-height: 1.9;
      color: #6b5a55;
      border-left: 3px solid #d4a8b0;
      padding-left: 1.2rem;
    }
    .footer {
      margin-top: 2rem;
      text-align: center;
      font-size: 0.72rem;
      color: #c8bab5;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="header-block">
        <div class="name">Bella's LifeOS</div>
        <div class="date">2026 年 05 月 04 日</div>
        <div class="weekday">星期一</div>
      </div>
    </div>
    <hr class="divider">
    
        <div class="section">
          <h2>📅 今日行程</h2>
          <ul class="events"><li><span class="time">全天</span><span class="title">陽明山健走</span></li><li><span class="time">全天</span><span class="title">天赦日</span></li></ul>
        </div>
    <hr class="divider">
    
        <div class="section quote-section">
          <h2>✨ 今日金句</h2>
          <blockquote>The only way to do great work is to love what you do.<br><br>── Steve Jobs<br><br>📖 中文：做偉大工作的唯一途徑，是熱愛你所做的事。<br><br>解說：熱情是成就卓越的源動力，只有真心投入，才能克服困難走向成功。</blockquote>
        </div>
    <div class="footer">每日 09:00 台北時間自動更新</div>
  </div>
</body>
</html>
