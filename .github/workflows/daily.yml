name: Daily Dashboard

on:
  schedule:
    - cron: "0 1 * * *"  # 每天 09:00 台北時間（UTC+8 = UTC 01:00）
  workflow_dispatch:       # 允許手動觸發

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install anthropic icalendar

      - name: Generate dashboard
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GCAL_ICAL_URL: ${{ secrets.GCAL_ICAL_URL }}
        run: python scripts/generate.py

      - name: Commit and push
        run: |
          git config user.name "Bella LifeOS Bot"
          git config user.email "actions@github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "chore: update dashboard $(date -u '+%Y-%m-%d')"
          git push
